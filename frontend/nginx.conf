server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off; # não conta a versão do nginx pra quem pergunta

    # Cabeçalhos de segurança básicos (o site não pode ser aberto dentro de outro site, etc.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # O site é de página única (React Router): qualquer endereço que não seja um arquivo
    # (ex: /produtos) devolve o index.html, e o React mostra a tela certa.
    location / {
        try_files $uri /index.html;
    }
}
