# Nginx como PROXY REVERSO: é a única porta de entrada do sistema (http://localhost:8080).
# Ele recebe todas as chamadas e encaminha pro serviço certo, dentro da rede do Docker
# (os nomes "frontend" e "backend" são os nomes dos serviços no docker-compose.yml).

server {
    listen 80;
    server_tokens off; # não conta a versão do nginx pra quem pergunta

    # /api/...  ->  backend (a API)
    # O "/api" é retirado antes de encaminhar (por causa da "/" no final do proxy_pass):
    #   o navegador pede  /api/produtos   e o backend recebe  /produtos
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCREVE (não soma) o IP de quem chamou: assim ninguém consegue fingir ser outro IP
        # mandando esse cabeçalho na mão, e a trava de tentativas de login não é enganada.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo o resto  ->  frontend (o site). O próprio frontend cuida das rotas da página (React Router).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
